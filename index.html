<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manoranjan - Money Saving & Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="8" fill="currentColor"/>
            <path d="M16 8v16M10 14h12M10 18h12" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Manoranjan</h1>
          <span class="tagline">Expense & Savings Tracker</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" id="logoutBtn" title="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </button>
        <button class="btn btn-secondary" id="syncDriveBtn" title="Save to Google Drive">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Backup to Drive
        </button>
        <button class="btn btn-secondary" id="importBtn" title="Restore from backup">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Import
        </button>
        <input type="file" id="importFile" accept=".json" style="display:none">
        <button class="btn btn-secondary" id="exportBtn" title="Export backup">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export
        </button>
      </div>
    </header>

    <!-- Summary Cards -->
    <section class="summary-section">
      <div class="summary-grid">
        <div class="summary-card summary-today" data-period="daily">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div class="card-content">
            <span class="card-label">Today's Savings</span>
            <span class="card-value" id="dailySavings">₹0.00</span>
            <div class="card-goal" id="dailyGoalLine"></div>
            <button class="card-edit-btn" data-period="daily" title="Set goal">Set goal</button>
          </div>
        </div>
        <div class="summary-card summary-monthly" data-period="monthly">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="8" y1="7" x2="16" y2="7"/>
              <line x1="8" y1="11" x2="16" y2="11"/>
            </svg>
          </div>
          <div class="card-content">
            <span class="card-label">Monthly Savings</span>
            <span class="card-value" id="monthlySavings">₹0.00</span>
            <div class="card-goal" id="monthlyGoalLine"></div>
            <button class="card-edit-btn" data-period="monthly" title="Set goal">Set goal</button>
          </div>
        </div>
        <div class="summary-card summary-yearly" data-period="yearly">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
          </div>
          <div class="card-content">
            <span class="card-label">Yearly Savings</span>
            <span class="card-value" id="yearlySavings">₹0.00</span>
            <div class="card-goal" id="yearlyGoalLine"></div>
            <button class="card-edit-btn" data-period="yearly" title="Set goal">Set goal</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Goal Modal -->
    <div class="modal-overlay" id="goalModal">
      <div class="modal">
        <h3 id="goalModalTitle">Set savings goal</h3>
        <form id="goalForm">
          <input type="hidden" id="goalPeriod">
          <div class="form-group">
            <label for="goalAmount">Target amount (₹)</label>
            <input type="number" id="goalAmount" placeholder="0.00" min="0" step="0.01">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="goalCancelBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save goal</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add Transaction -->
    <section class="add-transaction">
      <h2 class="section-title">Add Transaction</h2>
      <form id="transactionForm" class="transaction-form">
        <div class="form-row">
          <div class="form-group">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
              <option value="saving">Saving</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g., Groceries, Salary, UPI transfer">
          </div>
          <div class="form-group">
            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod">
              <option value="upi">UPI (GPay, PhonePe, Paytm)</option>
              <option value="cash">Cash</option>
              <option value="card">Card</option>
              <option value="bank">Bank Transfer</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <button type="submit" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Transaction
          </button>
        </div>
      </form>
    </section>

    <!-- Transaction List -->
    <section class="transactions-section">
      <div class="section-header">
        <h2 class="section-title">Recent Transactions</h2>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="today">Today</button>
          <button class="filter-tab" data-filter="month">This Month</button>
          <button class="filter-tab" data-filter="year">This Year</button>
        </div>
      </div>
      <div class="transactions-list" id="transactionsList">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="4" y="10" width="40" height="28" rx="3"/>
              <line x1="4" y1="18" x2="44" y2="18"/>
              <line x1="12" y1="26" x2="20" y2="26"/>
            </svg>
          </div>
          <p>No transactions yet</p>
          <span>Add your first expense, income, or savings to get started</span>
        </div>
      </div>
    </section>

  </div>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
